<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StopWatch · 固件布局预览</title>
<style>
*{box-sizing:border-box}body{margin:0;width:480px;background:#111;color:#ddd;font:14px/1.5 sans-serif}
figure{margin:0}canvas{display:block;width:480px;height:480px;background:black;border-radius:50%}
figcaption{height:36px;display:flex;align-items:center;justify-content:center;background:#202328;color:#d1d5db;font-size:12px}
.controls{padding:14px 20px}select{margin-left:12px;padding:4px;background:#222;color:#ddd;border:1px solid #555}
</style>
<figure><canvas id="watch" width="480" height="480" role="img" aria-label="表盘预览"></canvas>
<figcaption>软件渲染 · 示例数据 · 非设备实拍</figcaption></figure>
<div class="controls"><label>预览状态<select aria-label="预览状态"><option value="running">WORKING</option><option value="ready">READY</option><option value="needs_input">NEEDS INPUT</option><option value="offline">未同步 / 数据未知</option></select></label><span role="status"></span></div>
<script>
/* GLYPH_DATA */
const canvas=document.getElementById('watch'), ctx=canvas.getContext('2d');
const states={running:['WORKING',[55,117,124]],ready:['READY',[61,128,91]],needs_input:['NEEDS INPUT',[164,111,48]],offline:['IDLE',[76,96,106]]};
const warm=[216,215,205],ghost=[20,26,23],secondary=[94,108,114],cyan=[51,184,190];
const rgb=c=>'rgb('+c.join(',')+')';
function rect(x,y,w,h,c){ctx.fillStyle=rgb(c);ctx.fillRect(x,y,w,h)}
function line(x0,y0,x1,y1,c){ // Integer Bresenham, close to the firmware's drawLine.
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;
  while(true){rect(x0,y0,1,1,c);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}
}
function outline(x,y,w,h,c){rect(x,y,w,1,c);rect(x,y+h-1,w,1,c);rect(x,y,1,h,c);rect(x+w-1,y,1,h,c)}
function circle(x,y,r,c){ctx.fillStyle=rgb(c);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function width(text,s,t){let w=0;for(const ch of text)w+=ch===' '?3*s:3*s+t;return Math.max(0,w-t)}
function text(value,x,y,s,t,c){for(const ch of value.toUpperCase()){if(ch===' '){x+=3*s;continue}const map=FONT[ch]||'000000000000000';for(let r=0;r<5;r++)for(let col=0;col<3;col++)if(map[r*3+col]==='1')rect(x+col*s,y+r*s,s,s,c);x+=3*s+t}}
function centered(value,cx,y,s,t,c){text(value,cx-Math.floor(width(value,s,t)/2),y,s,t,c)}
function digit(ch,x,y){const map=DIGITS[ch]||'000000000000000000001111100000000000000000000';for(let r=0;r<9;r++)for(let col=0;col<5;col++)rect(x+col*9,y+r*8,7,7,map[r*5+col]==='1'?warm:ghost)}
function bezel(working){
  for(let tick=0;tick<60;tick++){const a=(-90+tick*6)*Math.PI/180,major=tick%5===0,inner=major?214:220;line(240+Math.cos(a)*inner,240+Math.sin(a)*inner,240+Math.cos(a)*228,240+Math.sin(a)*228,major?[66,76,86]:[34,43,51])}
  if(!working)return;
  const head=9.4,first=Math.floor(head)-4;
  for(let p=0;p<9;p++){const tick=first+p,d=Math.abs(tick-head);if(d>=4.5)continue;const shaped=Math.sin((1-d/4.5)*Math.PI/2)**2,major=((tick%60)+60)%60%5===0,len=(major?12:8)+Math.round(7*shaped),thickness=1+Math.round(2*shaped),a=(-90+tick*6)*Math.PI/180,rx=Math.cos(a),ry=Math.sin(a),strength=.18+shaped*.82,c=[23+(76-23)*strength,56+(184-56)*strength,60+(195-60)*strength].map(Math.floor);for(let w=-Math.floor(thickness/2);w<=Math.floor(thickness/2);w++)line(240+rx*(228-len)-ry*w,240+ry*(228-len)+rx*w,240+rx*228-ry*w,240+ry*228+rx*w,c)}
}
function gauge(cx,percent,c){const start=cx-48;for(let i=0;i<10;i++){rect(start+i*10,340,7,6,[31,37,44]);if(percent>=0){const w=Math.round(7*Math.max(0,Math.min(1,(percent-i*10)/10)));if(w)rect(start+i*10,340,w,6,c)}}}
function render(state){
  const unknown=state==='offline',[label,color]=states[state];rect(0,0,480,480,[0,0,0]);bezel(state==='running');
  centered(unknown?'TIME SYNC':'AUG 30  SUN',unknown?240:160,74,2,2,warm);
  if(!unknown){const wx=[85,142,164];circle(281,79,7,wx);circle(290,75,9,wx);rect(273,79,30,10,wx);text('29',311,74,2,2,wx);outline(328,72,4,4,wx);text('C',336,74,2,2,wx);ctx.font='16px "PingFang SC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=rgb(secondary);ctx.fillText('余杭',337,101)}
  let x=130;for(const ch of unknown?'----':'1021'){if(x===234){rect(x+3,172,7,7,cyan);rect(x+3,196,7,7,cyan);x+=20}digit(ch,x,148);x+=52}
  rect(120,238,240,1,[35,46,52]);rect(144,327,192,1,[35,46,52]);outline(146,267,10,10,color);rect(149,270,4,4,color);centered(label,240,267,3,3,color);centered(unknown?'MODEL --':'GPT-5.6-SOL',240,297,2,2,unknown?[67,75,79]:secondary);
  const data=[[145,'QUOTA',86,'LEFT',[74,111,188]],[240,'CPU',12,'USED',[184,68,74]],[335,'MEM',59,'USED',[190,148,38]]];
  for(const [cx,name,value,suffix,c] of data){gauge(cx,unknown?-1:value,c);centered(name,cx,358,2,2,c);centered(unknown?'--':value+'%',cx,378,4,3,c);centered(suffix,cx,407,2,2,secondary)}
  canvas.setAttribute('aria-label',label+'，固件布局软件预览，示例数据，非实拍');document.querySelector('[role=status]').textContent=' · '+label;
}
const select=document.querySelector('select');select.addEventListener('change',()=>render(select.value));render('running');
</script>
</html>
